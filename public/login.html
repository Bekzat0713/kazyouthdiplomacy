<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo.png">
  <title>Вход — KazYouthDiplomacy</title>
  <link rel="stylesheet" href="/web.css">
  <link rel="stylesheet" href="/auth.css">
  <link rel="apple-touch-icon" href="/icon-pwa.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KazYouth">
  <link rel="manifest" href="/manifest.json">
  <script src="/pwa.js" defer></script>
</head>
<body class="login-page auth-figma-page auth-compact-page">

<header class="auth-compact-header">
  <a href="/" class="logo-wrap" aria-label="KazYouthDiplomacy — на главную">
    <img src="/logo.png" alt="">
    <span>KazYouthDiplomacy</span>
  </a>
  <p>Нет аккаунта? <a href="/register">Создать</a></p>
</header>

<main class="auth-compact-main">
  <section class="auth-figma-card auth-compact-card" aria-labelledby="loginTitle">
    <div class="auth-figma-card-top auth-compact-title">
      <span class="auth-figma-card-badge">С возвращением</span>
      <h1 id="loginTitle">Войдите в аккаунт</h1>
      <p>Продолжите свой карьерный маршрут.</p>
    </div>

    <div class="auth-social-login" data-auth-social hidden>
      <a class="auth-social-btn auth-social-google" data-oauth-provider="google" href="/auth/google">
        <span class="auth-social-icon auth-social-icon-google" aria-hidden="true"></span>
        <span>Продолжить с Google</span>
      </a>
    </div>

    <div class="auth-divider" data-auth-social-divider hidden>
      <span>или через email</span>
    </div>

    <form id="loginForm" method="POST" action="/login" class="auth-figma-form" novalidate>
      <label class="auth-figma-field">
        <span>Email</span>
        <input
          id="emailInput"
          type="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          inputmode="email"
          required
        >
      </label>

      <label class="auth-figma-field">
        <span class="auth-field-heading">
          <span>Пароль</span>
          <a href="/forgot-password">Забыли пароль?</a>
        </span>
        <span class="auth-password-control">
          <input
            id="loginPassword"
            type="password"
            name="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
            required
          >
          <button class="auth-password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Показать пароль">
            Показать
          </button>
        </span>
      </label>

      <p id="authError" class="form-error auth-inline-message" role="alert" aria-live="polite" hidden></p>

      <button id="loginSubmit" class="btn primary auth-figma-submit" type="submit">
        Войти
      </button>
    </form>
  </section>
</main>

<script src="/app-config.js"></script>
<script src="/app-runtime.js"></script>
<script src="/login.js" defer></script>
</body>
</html>
