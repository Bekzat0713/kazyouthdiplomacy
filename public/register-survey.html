<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo.png">
  <title>Настройте рекомендации — KazYouthDiplomacy</title>
  <link rel="stylesheet" href="/web.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body class="register-survey-page auth-figma-page auth-compact-page">

<header class="auth-compact-header">
  <a href="/dashboard" class="logo-wrap" aria-label="KazYouthDiplomacy — в кабинет">
    <img src="/logo.png" alt="">
    <span>KazYouthDiplomacy</span>
  </a>
  <p><a href="/dashboard">Пропустить</a></p>
</header>

<main class="auth-compact-main">
  <section class="auth-figma-card auth-compact-card auth-onboarding-card" aria-labelledby="surveyTitle">
    <div class="auth-figma-card-top auth-compact-title">
      <span class="auth-figma-card-badge">Необязательно · около 30 секунд</span>
      <h1 id="surveyTitle">Настроим рекомендации</h1>
      <p>Три коротких вопроса — и подборки станут точнее.</p>
    </div>

    <form id="preRegisterSurveyForm" class="survey-form auth-figma-form" novalidate>
      <section class="survey-progress" aria-label="Прогресс">
        <div class="survey-progress-top">
          <span id="surveyStepLabel">Вопрос 1 из 3</span>
          <a href="/dashboard">Заполнить позже</a>
        </div>
        <div class="survey-progress-track" aria-hidden="true">
          <span id="surveyProgressFill" class="survey-progress-fill"></span>
        </div>
      </section>

      <section class="survey-section survey-step" data-field="current_status" data-kind="radio">
        <h2>Чем вы сейчас занимаетесь?</h2>
        <div class="survey-options">
          <label class="survey-option"><input type="radio" name="current_status" value="school"> Учусь в школе</label>
          <label class="survey-option"><input type="radio" name="current_status" value="university"> Учусь в университете</label>
          <label class="survey-option"><input type="radio" name="current_status" value="working"> Работаю</label>
          <label class="survey-option"><input type="radio" name="current_status" value="study_and_work"> Учусь и работаю</label>
        </div>
      </section>

      <section class="survey-section survey-step" data-field="main_goal" data-kind="radio" hidden>
        <h2>Какая цель сейчас главная?</h2>
        <div class="survey-options">
          <label class="survey-option"><input type="radio" name="main_goal" value="study_abroad"> Поступить за границу</label>
          <label class="survey-option"><input type="radio" name="main_goal" value="masters"> Поступить в магистратуру</label>
          <label class="survey-option"><input type="radio" name="main_goal" value="civil_service"> Попасть на госслужбу</label>
          <label class="survey-option"><input type="radio" name="main_goal" value="international_org"> Работать в международной организации</label>
          <label class="survey-option"><input type="radio" name="main_goal" value="national_company"> Устроиться в нацкомпанию</label>
          <label class="survey-option"><input type="radio" name="main_goal" value="private_sector"> Работать в частном секторе</label>
          <label class="survey-option"><input type="radio" name="main_goal" value="undecided"> Пока выбираю направление</label>
        </div>
      </section>

      <section class="survey-section survey-step" data-field="english_level" data-kind="radio" hidden>
        <h2>Какой у вас уровень английского?</h2>
        <div class="survey-options">
          <label class="survey-option"><input type="radio" name="english_level" value="a1_a2"> A1–A2 · начальный</label>
          <label class="survey-option"><input type="radio" name="english_level" value="b1_b2"> B1–B2 · средний</label>
          <label class="survey-option"><input type="radio" name="english_level" value="c1_plus"> C1 и выше · продвинутый</label>
        </div>
      </section>

      <p id="surveyError" class="form-error auth-inline-message" role="alert" aria-live="polite" hidden></p>

      <div class="survey-actions">
        <button id="surveyPrevBtn" class="btn secondary auth-figma-secondary-btn" type="button" hidden>Назад</button>
        <button id="surveyNextBtn" class="btn primary auth-figma-submit" type="button">Далее</button>
        <button id="surveySubmitBtn" class="btn primary auth-figma-submit" type="submit" hidden>Сохранить и открыть кабинет</button>
      </div>
    </form>
  </section>
</main>

<script src="/app-config.js"></script>
<script src="/app-runtime.js"></script>
<script src="/register-survey.js" defer></script>
</body>
</html>
