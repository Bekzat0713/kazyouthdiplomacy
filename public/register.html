<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/logo.png">
  <title>Создать аккаунт — KazYouthDiplomacy</title>
  <link rel="stylesheet" href="/web.css">
  <link rel="stylesheet" href="/auth.css">
  <link rel="apple-touch-icon" href="/icon-pwa.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KazYouth">
  <link rel="manifest" href="/manifest.json">
  <script src="/pwa.js" defer></script>
</head>
<body class="register-page auth-figma-page auth-compact-page">

<header class="auth-compact-header">
  <a href="/" class="logo-wrap" aria-label="KazYouthDiplomacy — на главную">
    <img src="/logo.png" alt="">
    <span>KazYouthDiplomacy</span>
  </a>
  <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
</header>

<main class="auth-compact-main">
  <section class="auth-figma-card auth-compact-card" aria-labelledby="registerTitle">
    <div class="auth-figma-card-top auth-compact-title">
      <span class="auth-figma-card-badge">Быстрый старт</span>
      <h1 id="registerTitle">Создайте аккаунт</h1>
      <p>Займёт меньше минуты. Профиль можно заполнить позже.</p>
    </div>

    <div class="auth-social-login" data-auth-social hidden>
      <a class="auth-social-btn auth-social-google" data-oauth-provider="google" href="/auth/google">
        <span class="auth-social-icon auth-social-icon-google" aria-hidden="true"></span>
        <span>Продолжить с Google</span>
      </a>
    </div>

    <div class="auth-divider" data-auth-social-divider hidden>
      <span>или через email</span>
    </div>

    <form id="registerForm" method="POST" action="/register" class="auth-figma-form" novalidate>
      <label class="auth-figma-field">
        <span>Имя</span>
        <input
          type="text"
          name="firstName"
          placeholder="Как к вам обращаться?"
          autocomplete="given-name"
          maxlength="80"
          required
        >
      </label>

      <label class="auth-figma-field">
        <span>Email</span>
        <input
          type="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          inputmode="email"
          required
        >
      </label>

      <label class="auth-figma-field">
        <span>Пароль</span>
        <span class="auth-password-control">
          <input
            id="registerPassword"
            type="password"
            name="password"
            placeholder="Минимум 10 символов"
            autocomplete="new-password"
            minlength="10"
            required
          >
          <button class="auth-password-toggle" type="button" data-password-toggle="registerPassword" aria-label="Показать пароль">
            Показать
          </button>
        </span>
      </label>

      <div class="auth-password-rules" aria-live="polite">
        <span data-password-rule="length">10+ символов</span>
        <span data-password-rule="letter">Одна буква</span>
        <span data-password-rule="digit">Одна цифра</span>
      </div>

      <p id="authError" class="form-error auth-inline-message" role="alert" aria-live="polite" hidden></p>

      <button id="registerSubmit" class="btn primary auth-figma-submit" type="submit">
        Создать аккаунт
      </button>
    </form>

  </section>
</main>

<script src="/app-config.js"></script>
<script src="/app-runtime.js"></script>
<script src="/register.js" defer></script>
</body>
</html>
